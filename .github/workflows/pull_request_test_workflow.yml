name: Pull Request Tests

on:
  pull_request:
    branches: [ "main" ]
    paths:
      - 'cvmatrix/**'
      - 'tests/**'
      - '.github/**'
      - 'pyproject.toml'
      - 'uv.lock'

jobs:
  # Full test suite with the JAX backend installed (also runs backend="jax" tests)
  test_package_with_jax:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14", "3.15", "3.15t"]
        # jaxlib publishes no free-threaded (cp315t) wheel for Windows, and no sdist.
        # Windows x 3.15t is still tested by the numpy-only job below.
        exclude:
          - os: windows-latest
            python-version: "3.15t"
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/test
        with:
          PYTHON_VERSION: ${{ matrix.python-version }}
          INSTALL_JAX: 'true'

      - name: Upload coverage to Coveralls
        uses: coverallsapp/github-action@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path-to-lcov: coverage.xml
          flag-name: ${{ matrix.os }}-python-${{ matrix.python-version }}-jax
          parallel: true
          fail-on-error: false

  # Numpy-only installation (without JAX); backend="jax" tests are skipped
  test_package_numpy_only:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14", "3.15", "3.15t"]
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/test
        with:
          PYTHON_VERSION: ${{ matrix.python-version }}
          INSTALL_JAX: 'false'

      - name: Upload coverage to Coveralls
        uses: coverallsapp/github-action@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path-to-lcov: coverage.xml
          flag-name: ${{ matrix.os }}-python-${{ matrix.python-version }}-numpy-only
          parallel: true
          fail-on-error: false

  finish:
    needs: [test_package_with_jax, test_package_numpy_only]
    runs-on: ubuntu-latest
    steps:
      - name: Finish Coveralls
        uses: coverallsapp/github-action@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          parallel-finished: true
          fail-on-error: false