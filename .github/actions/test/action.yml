name: Test
description: Test the package

inputs:
  PYTHON_VERSION:
    description: Test Python version
    required: true
  INSTALL_JAX:
    description: Whether to install the optional JAX backend extra (true/false)
    required: false
    default: 'true'

runs:
  using: "composite"
  steps:
    - name: Install uv
      uses: astral-sh/setup-uv@v7
      with:
        python-version: ${{ inputs.PYTHON_VERSION }}

    - name: Install project dependencies (with JAX backend)
      if: ${{ inputs.INSTALL_JAX == 'true' }}
      run: uv sync --extra jax --group dev
      shell: bash

    - name: Install project dependencies (numpy-only, without JAX)
      if: ${{ inputs.INSTALL_JAX != 'true' }}
      run: uv sync --group dev
      shell: bash

    # On free-threaded Python (e.g. 3.15t), importing an extension module that does not
    # support free threading silently re-enables the GIL, and the tests would then pass
    # without exercising free threading. Fail if any test dependency re-enables it.
    - name: Check that the GIL stays disabled (free-threaded Python only)
      if: ${{ endsWith(inputs.PYTHON_VERSION, 't') }}
      run: |
        uv run python - <<'EOF'
        import importlib.util
        import sys

        import coverage, cvmatrix, numpy, pandas, pytest, typeguard  # noqa: E401, F401

        if importlib.util.find_spec("jax") is not None:
            import jax.numpy  # noqa: F401
        if sys._is_gil_enabled():
            sys.exit("The GIL was re-enabled by an imported extension module.")
        print("The GIL stays disabled with all test dependencies imported.")
        EOF
      shell: bash

    # The same test suite runs in both modes. With the JAX backend installed it also
    # exercises the parametrized backend="jax" tests; without JAX those parametrizations
    # are skipped (pytest.importorskip), verifying the numpy-only path.
    - name: Run tests
      run: |
        # NOTE: --typeguard-packages takes the PACKAGE name "cvmatrix" (not a path); a
        # trailing slash silently instruments nothing, disabling runtime type checks.
        uv run pytest tests --doctest-modules --junitxml=junit/test-results.xml --cov=cvmatrix/ --cov-report=xml --typeguard-packages=cvmatrix
      shell: bash
